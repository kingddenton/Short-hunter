<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Hunter — Basic Supertrend Scanner</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#26344f;--text:#e8eefb;--muted:#91a2bf;--green:#27c58b;--red:#f16b78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:#0e1628}h1{font-size:21px;margin:0}main{max-width:1300px;margin:auto;padding:14px}
.panel,.tfcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.controls{margin-bottom:14px}
button{font:inherit;color:var(--text);background:#203454;border:1px solid #344563;border-radius:8px;padding:9px 14px;min-height:40px;font-weight:650;cursor:pointer}
button.primary{background:#245cba;border-color:#3476db}button.stop{background:#5b2632;border-color:#8b3d4c}button:disabled{opacity:.5;cursor:not-allowed}
.status{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tfhead{font-weight:750;font-size:18px;margin-bottom:10px}.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:#0e1729;border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
.side h3{font-size:12px;letter-spacing:.5px;margin:0 0 8px}.bull h3{color:var(--green)}.bear h3{color:var(--red)}
.alert{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid #24314a;font-size:13px}.alert:first-of-type{border-top:0}.symbol{font-weight:750}.time{color:var(--muted);font-size:11px}.empty{color:#7485a3;font-size:12px;padding:6px 0}
.note{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.sides{grid-template-columns:1fr 1fr}header{padding:13px}main{padding:10px}}
</style>
</head>
<body>
<header><h1>SHORT HUNTER</h1></header>
<main>
<section class="panel controls">
 <div class="row">
  <button class="primary" id="startBtn">Start scanning</button>
  <button class="stop" id="stopBtn" disabled>Stop</button>
  <button id="scanBtn">Scan once</button>
  <button id="clearBtn">Clear alerts</button>
  <span class="status" id="status">Idle · Waiting to start</span>
 </div>
 <div class="note">Basic Supertrend reversal test · Binance USDⓈ-M active perpetual contracts · ATR 10, multiplier 3 · completed candles only · automatic scan every 60 seconds</div>
</section>
<section class="grid" id="dashboard"></section>
</main>
<script>
(()=> {
const BASE='https://fapi.binance.com';
const TFS=['1m','3m','5m','15m'];
const $=id=>document.getElementById(id);
let running=false,busy=false,loopTimer=null,exchangeSymbols=null;
const alerts=Object.fromEntries(TFS.map(tf=>[tf,{bull:[],bear:[]} ]));
const lastProcessed=new Map();
const seen=new Set();
const status=s=>{$('status').textContent=s};
function render(){
 $('dashboard').innerHTML=TFS.map(tf=>'<section class="tfcard"><div class="tfhead">'+tf+'</div><div class="sides"><div class="side bull"><h3>BULLISH REVERSAL</h3><div id="'+tf+'-bull"><div class="empty">No alerts yet</div></div></div><div class="side bear"><h3>BEARISH REVERSAL</h3><div id="'+tf+'-bear"><div class="empty">No alerts yet</div></div></div></div></section>').join('');
 draw();
}
function draw(){
 for(const tf of TFS)for(const side of ['bull','bear']){
  const el=$(tf+'-'+side);if(!el)continue;
  const list=alerts[tf][side];
  el.innerHTML=list.length?list.slice(0,5).map(a=>'<div class="alert"><span class="symbol">'+a.symbol+'</span><span class="time">'+new Date(a.time).toLocaleString()+'</span></div>').join(''):'<div class="empty">No alerts yet</div>';
 }
}
async function getJson(url){
 const response=await fetch(url);
 if(!response.ok)throw new Error('Binance HTTP '+response.status);
 return response.json();
}
async function getUniverse(){
 const [tickers,info]=await Promise.all([
  getJson(BASE+'/fapi/v1/ticker/24hr'),
  exchangeSymbols?Promise.resolve(null):getJson(BASE+'/fapi/v1/exchangeInfo')
 ]);
 if(!exchangeSymbols){
  exchangeSymbols=new Set(info.symbols.filter(s=>s.contractType==='PERPETUAL'&&s.status==='TRADING'&&['USDT','USDC'].includes(s.quoteAsset)).map(s=>s.symbol));
 }
 return tickers.filter(t=>exchangeSymbols.has(t.symbol)).map(t=>t.symbol);
}
function supertrend(candles){
 const n=candles.length,p=10,m=3;
 if(n<p+3)return null;
 const tr=Array(n).fill(0),atr=Array(n).fill(null),upper=Array(n).fill(null),lower=Array(n).fill(null),dir=Array(n).fill(null);
 for(let i=1;i<n;i++)tr[i]=Math.max(candles[i].h-candles[i].l,Math.abs(candles[i].h-candles[i-1].c),Math.abs(candles[i].l-candles[i-1].c));
 let seed=0;for(let i=1;i<=p;i++)seed+=tr[i];atr[p]=seed/p;
 for(let i=p+1;i<n;i++)atr[i]=(atr[i-1]*(p-1)+tr[i])/p;
 for(let i=p;i<n;i++){
  const mid=(candles[i].h+candles[i].l)/2,bu=mid+m*atr[i],bl=mid-m*atr[i];
  upper[i]=(i===p||bu<upper[i-1]||candles[i-1].c>upper[i-1])?bu:upper[i-1];
  lower[i]=(i===p||bl>lower[i-1]||candles[i-1].c<lower[i-1])?bl:lower[i-1];
  if(i===p)dir[i]=candles[i].c>=mid?1:-1;
  else dir[i]=dir[i-1]===1?(candles[i].c<lower[i]?-1:1):(candles[i].c>upper[i]?1:-1);
 }
 return dir;
}
async function mapLimit(items,limit,fn){
 let index=0;
 const workers=Array.from({length:Math.min(limit,items.length)},async()=>{
  while(index<items.length){
   const current=index++;
   await fn(items[current],current);
  }
 });
 await Promise.all(workers);
}
async function scan(){
 if(busy)return;
 busy=true;
 const started=Date.now();
 try{
  status('Loading USDⓈ-M contracts…');
  const symbols=await getUniverse();
  let completed=0,newCount=0,failures=0;
  status('Checking '+symbols.length+' contracts across four timeframes…');
  const jobs=symbols.flatMap(symbol=>TFS.map(tf=>({symbol,tf})));
  await mapLimit(jobs,4,async({symbol,tf})=>{
   try{
    const raw=await getJson(BASE+'/fapi/v1/klines?symbol='+symbol+'&interval='+tf+'&limit=120');
    // Drop Binance's currently forming candle. Every comparison below uses completed candles.
    const candles=raw.slice(0,-1).map(k=>({openTime:Number(k[0]),closeTime:Number(k[6]),h:Number(k[2]),l:Number(k[3]),c:Number(k[4])}));
    const directions=supertrend(candles);
    if(!directions||candles.length<2)return;
    const key=symbol+'|'+tf;
    const previousProcessed=lastProcessed.get(key);
    const latest=candles.length-1;
    if(previousProcessed===undefined){
     // First scan establishes a baseline; it does not generate historical alerts.
     lastProcessed.set(key,candles[latest].closeTime);
     return;
    }
    for(let i=1;i<=latest;i++){
     if(candles[i].closeTime<=previousProcessed)continue;
     const before=directions[i-1],after=directions[i];
     const side=before===-1&&after===1?'bull':before===1&&after===-1?'bear':null;
     if(side){
      const alertKey=symbol+'|'+tf+'|'+side+'|'+candles[i].closeTime;
      if(!seen.has(alertKey)){
       seen.add(alertKey);
       alerts[tf][side].unshift({symbol,time:candles[i].closeTime});
       alerts[tf][side]=alerts[tf][side].slice(0,5);
       newCount++;
      }
     }
    }
    lastProcessed.set(key,candles[latest].closeTime);
   }catch(error){failures++}
   completed++;
   if(completed%40===0)status('Checked '+completed+'/'+jobs.length+' timeframe checks · '+newCount+' new reversals');
  });
  draw();
  status('Scan complete · '+symbols.length+' contracts · '+newCount+' new reversals · '+failures+' data errors · '+((Date.now()-started)/1000).toFixed(1)+'s');
 }catch(error){status('Scanner error · '+error.message)}
 finally{busy=false}
}
async function scanLoop(){
 if(!running)return;
 await scan();
 if(running)loopTimer=setTimeout(scanLoop,60000);
}
function start(){
 if(running)return;
 running=true;
 $('startBtn').disabled=true;$('stopBtn').disabled=false;
 scanLoop();
}
function stop(){
 running=false;
 if(loopTimer)clearTimeout(loopTimer);
 loopTimer=null;
 $('startBtn').disabled=false;$('stopBtn').disabled=true;
 status('Stopped');
}
$('startBtn').onclick=start;
$('stopBtn').onclick=stop;
$('scanBtn').onclick=scan;
$('clearBtn').onclick=()=>{
 for(const tf of TFS)alerts[tf]={bull:[],bear:[]};
 draw();
};
render();
})();
</script>
</body>
</html>
